[project]
name = "aegis-forge"
version = "0.1.0"
description = "Python ingestion and evaluation sidecar for Aegis"
requires-python = ">=3.12"
authors = [{ name = "Musa Divarcı" }]
dependencies = [
  "pydantic>=2.9,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
aegis-forge = "aegis_forge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_forge"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
